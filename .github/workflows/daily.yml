name: Daily Commit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update log file
        run: |
          echo "Daily commit at $(date)" >> log.txt
          git config user.name "tosen07"
          git config user.email "tosen07@users.noreply.github.com"
          git add log.txt
          git commit -m "Daily commit $(date)" || echo "No changes to commit"
          git push
